name: Raindrop Desktop

on:
  push:
    tags: ["raindrop-desktop-v*"]
    branches: [main]
    paths: ["desktop/**", "src/**", "Cargo.*", "vendor/**", "build/**", "build.rs", "plugins/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "src/**", "Cargo.*", "vendor/**", "build/**", "build.rs", "plugins/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.4.0
      - run: npm install --global npm@12.0.1 --ignore-scripts
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-core-resources
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  build:
    needs: resources
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config clang cmake perl
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-core-resources
          path: web/dist
      - name: Check independent version and desktop tag
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          package = tomllib.loads(pathlib.Path('desktop/Cargo.toml').read_text())['package']
          assert package['name'] == 'raindrop-desktop'
          assert package['version'] == json.loads(pathlib.Path('desktop/nsh.json').read_text())['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'raindrop-desktop-v' + package['version']
          PY
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: cargo test --manifest-path desktop/Cargo.toml --locked
      - run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build development preview
        if: github.ref_type != 'tag'
        run: cargo build --manifest-path desktop/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Build release with official plugin signature
        if: github.ref_type == 'tag'
        env:
          RAINDROP_REQUIRE_OFFICIAL_PLUGIN_SIGNATURE: "1"
          RAINDROP_OFFICIAL_PLUGIN_SIGNING_KEY_ID: raindrop-release-2026
          RAINDROP_OFFICIAL_PLUGIN_SIGNING_SEED: ${{ secrets.RAINDROP_OFFICIAL_PLUGIN_SIGNING_SEED }}
        run: cargo build --manifest-path desktop/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Package native desktop
        run: python desktop/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-package-${{ matrix.target }}
          path: dist/raindrop-desktop-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-package-*
          path: dist
          merge-multiple: true
      - name: Publish separate desktop prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum raindrop-desktop-*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" raindrop-desktop-*.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Raindrop Desktop ${GITHUB_REF_NAME#raindrop-desktop-v}" \
            --notes-file ../desktop/RELEASE.md
