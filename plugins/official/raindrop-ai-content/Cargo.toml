[package]
name = "raindrop-ai-content"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
async-trait = "0.1.89"
rutis = "=0.13.0"
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }
