[package]
"name" = "dlx"
"description" = "A Rust package for unlimited DeepL translation"
"version" = "3.0.1"
"edition" = "2024"
"authors" = ["Homing So <i@homing.so>"]
"license" = "MIT"
"readme" = "README.md"
"repository" = "https://github.com/hominsu/deeplx-rs"
"keywords" = ["dlx", "deeplx", "translation"]
"categories" = ["text-processing", "internationalization"]
"metadata" = { "docs" = { "rs" = { "all-features" = true } } }
"publish" = false
"autotests" = false
"autobenches" = false
"autoexamples" = false

[dependencies]
"rand" = "0.9"
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = "1"
"secrecy" = "0.10"
"thiserror" = { "version" = "2" }
"impit" = { "git" = "https://github.com/apify/impit.git", "branch" = "master" }
"h2" = "0.4.16"
"reqwest" = { "version" = "0.13.4", "default-features" = false, "features" = ["rustls", "charset", "http2", "http3", "brotli", "cookies", "deflate", "gzip", "json"] }
