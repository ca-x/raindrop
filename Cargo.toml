[package]
name = "raindrop"
version = "0.6.3"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "A self-hosted, multi-user RSS reader"
repository = "https://github.com/ca-x/raindrop"

[workspace]
members = ["plugins/official/raindrop-ai-content"]
exclude = ["vendor/dlx", "vendor/rustls"]
resolver = "3"

[dependencies]
ammonia = "=4.1.8"
anyhow = "1.0.103"
argon2 = { version = "0.5.3", features = ["std"] }
async-compression = { version = "0.4.48", default-features = false, features = ["tokio", "gzip", "zlib", "brotli"] }
async-trait = "0.1.89"
aws-credential-types = "=1.2.14"
aws-sigv4 = "=1.4.5"
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.23.1"
blake3 = "1.8.3"
brotli-decompressor = "5.0.3"
cookie = "0.18.1"
constant_time_eq = "0.4.2"
dlx = { version = "=3.0.1", path = "vendor/dlx", default-features = false }
encoding_rs = "=0.8.35"
feedparser-rs = { version = "=0.5.5", default-features = false }
futures-util = "0.3.32"
hickory-resolver = { version = "=0.26.2", default-features = false, features = ["system-config", "tokio"] }
http = { version = "1.4.2", default-features = false }
html5ever = "=0.39.0"
httpdate = "1.0.3"
ipnet = { version = "2.12.0", default-features = false }
mime = "=0.3.17"
mime_guess = "2.0.5"
quick-xml = "=0.41.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = "=0.17.14"
rust-embed = "8.12.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
sea-orm = { version = "1.1.19", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-time"] }
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["unbounded_depth"] }
secrecy = "0.10.3"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }
raindrop-ai-content = { path = "plugins/official/raindrop-ai-content" }
rutis = "=0.13.0"
wuff = { version = "0.2.8", default-features = false }
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
base64 = "0.23.1"
ring = "=0.17.14"
serde_json = { version = "1.0.150", features = ["unbounded_depth"] }
zeroize = "1.8.2"

[patch.crates-io]
hyper-util = { git = "https://github.com/apify/hyper-util", rev = "9b7795dfd7158fc55e7c84b65bf1dae1d2dea67d" }
rustls = { path = "vendor/rustls" }

[profile.release]
lto = "thin"
strip = "symbols"
